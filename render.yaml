# Render Blueprint: New + → Blueprint → pick this repo. Deploys the relay server on the free plan.
services:
  - type: web
    name: tandem-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
