name: Release

# Push a tag like v1.5.0 to publish the extension zip on the Releases page.
# This zip has no server built in: people enter it in the popup → ⚙ Server settings.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: ./scripts/package-extension.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/tandem-*.zip --title "Tandem $GITHUB_REF_NAME" --generate-notes
